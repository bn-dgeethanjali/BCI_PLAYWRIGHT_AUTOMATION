# GitLab CI/CD Pipeline for BCI Playwright MCP Automation
# Runs UI tests using Playwright MCP Server

stages:
  - lint
  - test
  - report
  - deploy

variables:
  PYTHON_VERSION: "3.9"
  HEADLESS: "true"
  USE_MCP: "true"
  MCP_PROJECT: "rulegenai"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache pip packages between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

# ==============================================
# Templates
# ==============================================
.python_setup: &python_setup
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - playwright install chromium
    - playwright install-deps chromium
    - mkdir -p screenshots reports allure-results

# ==============================================
# Stage: Lint
# ==============================================
lint:
  stage: lint
  image: python:${PYTHON_VERSION}
  script:
    - pip install flake8 black
    - flake8 tests/ pages/ mcp/ --max-line-length=120 --ignore=E501,W503 || true
    - black --check tests/ pages/ mcp/ --line-length=120 || true
  allow_failure: true

# ==============================================
# Stage: Test
# ==============================================
test:rulegenai:
  <<: *python_setup
  stage: test
  variables:
    MCP_PROJECT: "rulegenai"
  script:
    - |
      pytest tests/ui/rulegenai/ \
        -v \
        --tb=short \
        --html=reports/rulegenai/report.html \
        --self-contained-html \
        --junitxml=reports/rulegenai/junit.xml \
        --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - reports/
      - screenshots/
      - allure-results/
    reports:
      junit: reports/rulegenai/junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:login:
  <<: *python_setup
  stage: test
  variables:
    MCP_PROJECT: "rulegenai"
  script:
    - |
      pytest tests/ui/rulegenai/test_login.py \
        -v \
        --tb=short \
        --html=reports/login/report.html \
        --self-contained-html \
        --junitxml=reports/login/junit.xml
  artifacts:
    when: always
    paths:
      - reports/login/
      - screenshots/
    reports:
      junit: reports/login/junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:workspace:
  <<: *python_setup
  stage: test
  variables:
    MCP_PROJECT: "rulegenai"
  script:
    - |
      pytest tests/ui/rulegenai/test_workspace.py \
        -v \
        --tb=short \
        --html=reports/workspace/report.html \
        --self-contained-html \
        --junitxml=reports/workspace/junit.xml
  artifacts:
    when: always
    paths:
      - reports/workspace/
      - screenshots/
    reports:
      junit: reports/workspace/junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:rule_generation:
  <<: *python_setup
  stage: test
  variables:
    MCP_PROJECT: "rulegenai"
  script:
    - |
      pytest tests/ui/rulegenai/test_rule_generation.py \
        -v \
        --tb=short \
        --html=reports/rule_generation/report.html \
        --self-contained-html \
        --junitxml=reports/rule_generation/junit.xml
  artifacts:
    when: always
    paths:
      - reports/rule_generation/
      - screenshots/
    reports:
      junit: reports/rule_generation/junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==============================================
# Stage: Report
# ==============================================
allure_report:
  stage: report
  image: frankescobar/allure-docker-service
  script:
    - allure generate allure-results -o allure-report --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 30 days
  needs:
    - job: test:rulegenai
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==============================================
# Stage: Deploy Report
# ==============================================
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r allure-report/* public/
  artifacts:
    paths:
      - public
  needs:
    - allure_report
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==============================================
# Scheduled Jobs
# ==============================================
nightly:regression:
  <<: *python_setup
  stage: test
  script:
    - |
      pytest tests/ui/rulegenai/ \
        -v \
        --tb=short \
        --html=reports/nightly/report.html \
        --self-contained-html \
        --junitxml=reports/nightly/junit.xml \
        --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - reports/nightly/
      - screenshots/
      - allure-results/
    reports:
      junit: reports/nightly/junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
